<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <meta name="description" content="404 · 页面不存在">
  <!-- 404 会命中任意深度的失效路径，资源一律用根绝对路径 -->
  <title>404 · 跨世代</title>
  <link rel="stylesheet" href="/css/style.css?v=20261061">
  <style>
    body { display: grid; place-items: center; min-height: 100svh; }
    .err-wrap { position: relative; z-index: 1; text-align: center; padding: 24px; }
    .err-card { display: inline-block; padding: 44px 52px 40px; }
    .err-orb {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 2px 10px rgba(8, 32, 40, 0.5);
    }
    .err-code {
      font-size: clamp(64px, 14vw, 96px);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1;
      background: linear-gradient(135deg, var(--teal), var(--peach));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .err-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.12em;
      margin: 14px 0 10px;
    }
    .err-text {
      font-size: 14px;
      color: var(--muted);
      line-height: 2;
      margin-bottom: 26px;
    }
    @media (max-width: 480px) { .err-card { padding: 36px 30px 34px; } }
  </style>
</head>
<body>

  <!-- 全页天幕：与主站同一套流动底色 + 极光 -->
  <div class="page-flow" aria-hidden="true"></div>
  <div class="page-aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="err-wrap">
    <div class="glass-panel err-card tilt">
      <i class="glare" aria-hidden="true"></i>
      <div class="glass-orb err-orb" aria-hidden="true">✦</div>
      <p class="err-code">404</p>
      <h1 class="err-title">迷路了</h1>
      <p class="err-text">这个页面不存在，或者已经搬走了。<br>首页的风景还在老地方等你。</p>
      <a class="cta-btn" href="/">回首页</a>
    </div>
  </main>

  <script>
    // 无 JS 框架的深色跟随：只做一次系统偏好判定
    if (matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark');
  </script>
</body>
</html>
