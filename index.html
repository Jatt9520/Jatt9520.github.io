<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="跨世代 · 个人创作者。原生代码手写的液态玻璃个人站：创作初衷与项目展示。">
  <!-- 相对路径基准：适配 GitHub Pages 子路径部署 -->
  <base href="./">
  <title>跨世代 · Liquid Glass</title>
  <link rel="stylesheet" href="css/style.css?v=20261079">
  <link rel="stylesheet" href="css/showcase.css?v=20261079">
</head>
<body>

  <!-- 全页视频背景：放入 assets/hero-video.mp4 后自动启用固定播放 -->
  <video id="hero-video" muted loop playsinline preload="auto" hidden
         aria-hidden="true"></video>

  <!-- 全页天幕：流动渐变层 + 极光层（fixed，所有屏共享同一底，翻页无接缝） -->
  <div class="page-flow" aria-hidden="true"></div>
  <div class="page-aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- 左上角身份栏：头像 + 名字 + 引言（点击头像丝滑展开自我介绍） -->
  <header class="identity glass-chip" id="identity">
    <button class="avatar glass-orb" id="avatar" type="button"
            aria-expanded="false" aria-controls="about-card" title="关于我">
      <img src="assets/avatar.jpg?v=2" alt="跨世代的头像" id="avatar-img">
    </button>
    <div class="identity-text">
      <h1 class="identity-name" id="hero-name"></h1>
      <p class="identity-motto" id="hero-motto"></p>
    </div>
  </header>

  <!-- 展开的自我介绍玻璃卡：挂在 body 层（身份栏自带模糊，会把子卡的
       背板采样圈死在自己的合成根里，字透出来没有模糊），fixed 定位到卡下 -->
  <div class="about-card glass-panel" id="about-card">
    <p class="about-kicker" id="about-kicker"></p>
    <h2 class="about-title" id="about-title"></h2>
    <p class="about-text" id="about-text"></p>
    <div class="about-actions">
      <a class="ghost-btn" id="about-github" target="_blank" rel="noopener"></a>
      <button class="ghost-btn" id="about-fold" type="button">收起</button>
    </div>
  </div>

  <!-- 快捷导航球：固定悬浮，点击弹出快捷菜单（回顶部 / 初衷 / 项目 / 炫技区 / GitHub） -->
  <div class="orb-anchor" id="orb-anchor">
    <button class="orb glass-orb orb-c" id="orb-nav" type="button" data-depth="0.04"
            style="--d:42s" aria-expanded="false" aria-controls="orb-menu" aria-label="快捷导航">
      <span class="orb-glyph" aria-hidden="true">✦</span>
    </button>
    <nav class="orb-menu" id="orb-menu" hidden aria-label="快捷导航菜单">
      <button class="orb-item" data-go="top" type="button">⌂ 回顶部</button>
      <button class="orb-item" data-go="s-creation" type="button">✎ 创作初衷</button>
      <button class="orb-item" data-go="s-projects" type="button">◈ 我的项目</button>
      <button class="orb-item" data-go="s-showcase" type="button">⚗ 炫技区</button>
      <a class="orb-item" id="orb-github" target="_blank" rel="noopener">↗ GitHub</a>
    </nav>
  </div>

  <!-- 右上角：深浅色切换 + 液态玻璃开关（悬停 1 秒显示功能提示） -->
  <div class="top-controls">
    <button class="theme-toggle glass-control" id="theme-toggle" type="button"
            aria-label="深浅色切换">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <g class="icon-moon">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
        </g>
        <g class="icon-sun" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.4" fill="currentColor" stroke="none"/>
          <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
        </g>
      </svg>
      <span class="tip">深浅色切换</span>
    </button>

    <button class="glass-toggle glass-control" id="glass-toggle" type="button"
            aria-pressed="true" aria-label="材质切换">
      <svg viewBox="0 0 36 36" width="18" height="18" aria-hidden="true">
        <circle class="glass-toggle-on"  cx="18" cy="18" r="7"/>
        <circle class="glass-toggle-off" cx="18" cy="18" r="7"/>
      </svg>
      <span class="tip">材质切换</span>
    </button>
  </div>

  <!-- ================= 全屏吸附滚动容器 ================= -->
  <main class="snap" id="snap">

    <!-- ===== 第一屏：唯美风景 ===== -->
    <section class="scene s-hero" id="s-hero">
      <div class="hero-bg" aria-hidden="true">
        <img src="assets/hero.jpg" alt="" id="hero-img">
      </div>
      <div class="hero-veil" aria-hidden="true"></div>
      <!-- 动态层：海面碎金波光 + 浮尘微粒（canvas 逐帧） -->
      <canvas class="hero-fx" id="hero-fx" aria-hidden="true"></canvas>

      <!-- 滚动提示 -->
      <button class="scroll-hint glass-chip" id="scroll-hint" type="button">
        <span id="scroll-hint-text"></span>
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path d="M4 9l8 8 8-8" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>

    <!-- ===== 第二屏：创作初衷 ===== -->
    <section class="scene s-creation" id="s-creation">
      <div class="scene-inner">
        <header class="scene-head">
          <p class="kicker reveal" id="creation-kicker"></p>
          <h2 class="scene-title" id="creation-title"></h2>
        </header>
        <div class="glass-panel tilt creation-panel reveal" id="creation-panel">
          <i class="glare" aria-hidden="true"></i>
          <p class="big-text" id="creation-text"></p>
          <div class="panel-links">
            <a class="ghost-btn magnetic" id="creation-github" target="_blank" rel="noopener"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 第三屏：我的项目 ===== -->
    <section class="scene s-projects" id="s-projects">
      <div class="scene-inner scene-inner-wide">
        <header class="scene-head">
          <p class="kicker reveal" id="projects-kicker"></p>
          <h2 class="scene-title" id="projects-title"></h2>
        </header>
        <div class="project-grid" id="project-grid">
          <!-- 骨架屏：加载时的玻璃占位 -->
          <div class="project-card glass-panel skeleton"><i class="glare"></i></div>
          <div class="project-card glass-panel skeleton"><i class="glare"></i></div>
          <div class="project-card glass-panel skeleton"><i class="glare"></i></div>
        </div>
        <p class="project-fallback glass-chip" id="project-fallback" hidden></p>
      </div>
    </section>

    <!-- ===== 第四屏：炫技区（内容超一屏，场景内部滚动，外层四页吸附节奏不变） ===== -->
    <section class="scene s-showcase" id="s-showcase">
      <div class="scene-inner scene-inner-wide">
        <header class="scene-head">
          <p class="kicker reveal" id="showcase-kicker"></p>
          <h2 class="scene-title" id="showcase-title"></h2>
          <p class="show-sub reveal" id="showcase-sub"></p>
        </header>

        <div class="show-grid" id="show-grid">

          <!-- ① 容器变形 7 连：七个几何状态的状态机 -->
          <article class="show-card glass-panel reveal">
            <i class="glare" aria-hidden="true"></i>
            <header class="show-head">
              <h3 class="show-name">容器变形 7 连</h3>
              <span class="pill">GSAP · 状态机</span>
            </header>
            <div class="stage stage-morph" id="st-morph" role="group"
                 aria-label="容器变形演示：点击画面推进到下一个形态">
              <div class="morph-fit">
                <div class="morph-box">
                  <div class="m-group" data-g="g-icon"><span class="m-glyph">✦</span></div>
                  <div class="m-group" data-g="g-pill">
                    <span class="m-glyph sm">✦</span><span class="m-text">继续探索</span>
                  </div>
                  <div class="m-group" data-g="g-card">
                    <strong class="m-title">展开的卡片</strong>
                    <p class="m-desc">胶囊撑开成卡，内容成组浮现</p>
                    <div class="m-chips">
                      <span class="m-chip">液态玻璃</span><span class="m-chip">OriginOS 手感</span>
                    </div>
                  </div>
                  <div class="m-group" data-g="g-upload">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                      <path d="M12 19V6M5.5 12.5L12 6l6.5 6.5" fill="none" stroke="#fff"
                            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="m-text">上传作品</span>
                  </div>
                  <div class="m-group" data-g="g-size">
                    <div class="m-grid">
                      <i class="m-block"></i><i class="m-block"></i><i class="m-block"></i><i class="m-block"></i>
                    </div>
                  </div>
                  <div class="m-group g-reflow" data-g="g-reflow">
                    <span class="m-num">①</span><span class="m-num">②</span>
                    <span class="m-num">③</span><span class="m-num">④</span>
                  </div>
                  <div class="m-group" data-g="g-done">
                    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                      <path d="M4.5 12.5l5 5 10-11" fill="none" stroke="#fff"
                            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </div>
                </div>
              </div>
              <p class="morph-label" id="morph-label" aria-live="polite"></p>
            </div>
            <footer class="show-foot">
              <div class="foot-ctrl">
                <button class="mini-btn" id="morph-prev" type="button">← 上一步</button>
                <button class="mini-btn" id="morph-next" type="button">下一步 →</button>
                <button class="mini-btn" id="morph-auto" type="button" aria-pressed="false">▶ 自动轮播</button>
              </div>
              <span class="foot-hint">点画面也能推进</span>
            </footer>
          </article>

          <!-- ② 磁吸线条：指针/手指靠近时线条像铁屑一样转向 -->
          <article class="show-card glass-panel reveal">
            <i class="glare" aria-hidden="true"></i>
            <header class="show-head">
              <h3 class="show-name">磁吸线条</h3>
              <span class="pill">Canvas · 指针物理</span>
            </header>
            <div class="stage stage-touch" id="st-magnet" role="group"
                 aria-label="磁吸线条演示区：指针划过或手指拖动，线条会转向跟随">
            </div>
            <footer class="show-foot">
              <span class="foot-hint">划过画面 · 线条像铁屑一样转向（手机拖一拖也行）</span>
            </footer>
          </article>

          <!-- ③ 流体模拟：GPU 流体力学旗舰（通栏大舞台） -->
          <article class="show-card show-card--wide glass-panel reveal">
            <i class="glare" aria-hidden="true"></i>
            <header class="show-head">
              <h3 class="show-name">流体模拟</h3>
              <span class="pill">WebGL · 流体力学</span>
            </header>
            <div class="stage stage--cinema stage-touch" id="st-fluid" role="group"
                 aria-label="流体模拟演示区：在画面上拖动，颜料会随涡流揉开；停下不动它自己也会涌">
            </div>
            <footer class="show-foot">
              <span class="foot-hint">随手搅一搅 · 涡流把颜料揉开，停下它自己也会涌</span>
            </footer>
          </article>

          <!-- ④ 液态透镜：SDF 光线行进玻璃熔球（通栏大舞台） -->
          <article class="show-card show-card--wide glass-panel reveal">
            <i class="glare" aria-hidden="true"></i>
            <header class="show-head">
              <h3 class="show-name">液态透镜</h3>
              <span class="pill">WebGL · 光线行进</span>
            </header>
            <div class="stage stage--cinema" id="st-glass" role="group"
                 aria-label="液态透镜演示区：三颗玻璃球熔成流动的变形虫，指尖伸过去它会涌过来">
            </div>
            <footer class="show-foot">
              <span class="foot-hint">指尖伸过去 · 玻璃熔体会朝你涌</span>
            </footer>
          </article>

        </div>

        <p class="show-end reveal" id="showcase-end"></p>

        <!-- 页脚：横置玻璃小胶囊（版权页脚归最后一页，跟随内容流） -->
        <footer class="footer-bar glass-chip" id="footer-bar">
          <i class="glare" aria-hidden="true"></i>
          <a class="footer-link" id="footer-github" target="_blank" rel="noopener"></a>
          <i class="footer-sep" aria-hidden="true"></i>
          <span class="footer-copy" id="footer-copy"></span>
        </footer>
      </div>
    </section>
  </main>

  <!-- ============ 欢迎弹窗（仅首次访问展示） ============ -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card glass-panel">
      <h1 class="modal-title" id="modal-title"></h1>
      <p class="modal-text" id="modal-text"></p>
      <button class="cta-btn magnetic" id="modal-btn" type="button"></button>
    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="js/config.js?v=20261079"></script>
  <script src="js/main.js?v=20261079"></script>
  <script src="js/showcase.js?v=20261079"></script>
  <script src="js/showcase-gl.js?v=20261079"></script>
</body>
</html>
