<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="跨世代 · 个人创作者。原生代码手写的液态玻璃个人站：创作初衷与项目展示。">
  <!-- 相对路径基准：适配 GitHub Pages 子路径部署 -->
  <base href="./">
  <title>跨世代 · Liquid Glass</title>
  <link rel="stylesheet" href="css/style.css?v=20261035">
  <!--
    =====================================================================
    GitHub Pages 部署步骤
    ---------------------------------------------------------------------
    1. 在 GitHub 新建仓库，仓库名：Jatt9520.github.io
    2. 上传全部文件（注意包含 assets/ 目录）：
         git add .
         git commit -m "refactor: liquid glass showcase"
         git push
    3. 仓库页 -> Settings -> Pages -> 选择 main 分支 / 根目录
    4. 访问 https://Jatt9520.github.io（push 后 1~2 分钟自动发布）

    说明：
    · 首屏风景 assets/hero.jpg（Unsplash 免费授权，可整图替换）
    · 液态玻璃为纯 CSS 材质（磨砂 + 折射描边 + 追光），无图片资源
    · 替换风景图：直接覆盖 assets/hero.jpg 即可，无需改代码
    =====================================================================
  -->
</head>
<body>

  <!-- 全页天幕：流动渐变层 + 极光层（fixed，所有屏共享同一底，翻页无接缝） -->
  <div class="page-flow" aria-hidden="true"></div>
  <div class="page-aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- 左上角身份栏：头像 + 名字 + 引言（点击头像丝滑展开自我介绍） -->
  <header class="identity glass-chip" id="identity">
    <button class="avatar glass-orb" id="avatar" type="button"
            aria-expanded="false" aria-controls="about-card" title="关于我">
      <img src="assets/avatar.jpg?v=2" alt="跨世代的头像" id="avatar-img">
    </button>
    <div class="identity-text">
      <h1 class="identity-name" id="hero-name"></h1>
      <p class="identity-motto" id="hero-motto"></p>
    </div>

    <!-- 展开的自我介绍玻璃卡（常驻渲染，玻璃材质预热在位） -->
    <div class="about-card glass-panel" id="about-card">
      <p class="about-kicker" id="about-kicker"></p>
      <h2 class="about-title" id="about-title"></h2>
      <p class="about-text" id="about-text"></p>
      <div class="about-actions">
        <a class="ghost-btn" id="about-github" target="_blank" rel="noopener"></a>
        <button class="ghost-btn" id="about-fold" type="button">收起</button>
      </div>
    </div>
  </header>

  <!-- 右上角：深浅色切换 + 液态玻璃开关（悬停 1 秒显示功能提示） -->
  <div class="top-controls">
    <button class="theme-toggle glass-control" id="theme-toggle" type="button"
            aria-label="深浅色切换">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <g class="icon-moon">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
        </g>
        <g class="icon-sun" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.4" fill="currentColor" stroke="none"/>
          <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
        </g>
      </svg>
      <span class="tip">深浅色切换</span>
    </button>

    <button class="glass-toggle glass-control" id="glass-toggle" type="button"
            aria-pressed="true" aria-label="材质切换">
      <svg viewBox="0 0 36 36" width="18" height="18" aria-hidden="true">
        <circle class="glass-toggle-on"  cx="18" cy="18" r="7"/>
        <circle class="glass-toggle-off" cx="18" cy="18" r="7"/>
      </svg>
      <span class="tip">材质切换</span>
    </button>
  </div>

  <!-- ================= 全屏吸附滚动容器 ================= -->
  <main class="snap" id="snap">

    <!-- ===== 第一屏：唯美风景 ===== -->
    <section class="scene s-hero" id="s-hero">
      <div class="hero-bg" aria-hidden="true">
        <img src="assets/hero.jpg" alt="" id="hero-img">
        <!-- 放入 assets/hero-video.mp4 后自动启用视频背景（见 main.js） -->
        <video id="hero-video" muted loop playsinline preload="auto" hidden></video>
      </div>
      <div class="hero-veil" aria-hidden="true"></div>
      <!-- 动态层：海面碎金波光 + 浮尘微粒（canvas 逐帧） -->
      <canvas class="hero-fx" id="hero-fx" aria-hidden="true"></canvas>

      <!-- 漂浮玻璃珠（真实折射 + 鼠标视差） -->
      <div class="orb glass-orb orb-c" data-depth="0.04" style="--d:42s" aria-hidden="true"></div>

      <!-- 滚动提示 -->
      <button class="scroll-hint glass-chip" id="scroll-hint" type="button">
        <span id="scroll-hint-text"></span>
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path d="M4 9l8 8 8-8" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>

    <!-- ===== 第二屏：创作初衷 ===== -->
    <section class="scene s-creation" id="s-creation">
      <div class="scene-inner">
        <header class="scene-head reveal">
          <p class="kicker" id="creation-kicker"></p>
          <h2 class="scene-title" id="creation-title"></h2>
        </header>
        <div class="glass-panel tilt creation-panel reveal" id="creation-panel">
          <i class="glare" aria-hidden="true"></i>
          <p class="big-text" id="creation-text"></p>
          <div class="panel-links">
            <a class="ghost-btn magnetic" id="creation-github" target="_blank" rel="noopener"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 第三屏：我的项目 ===== -->
    <section class="scene s-projects" id="s-projects">
      <div class="scene-inner scene-inner-wide">
        <header class="scene-head reveal">
          <p class="kicker" id="projects-kicker"></p>
          <h2 class="scene-title" id="projects-title"></h2>
        </header>
        <div class="project-grid" id="project-grid">
          <!-- 骨架屏：加载时的玻璃占位 -->
          <div class="project-card glass-panel skeleton"><i class="glare"></i></div>
          <div class="project-card glass-panel skeleton"><i class="glare"></i></div>
          <div class="project-card glass-panel skeleton"><i class="glare"></i></div>
        </div>
        <p class="project-fallback glass-chip" id="project-fallback" hidden></p>
      </div>

      <!-- 页脚：横置玻璃小胶囊，置于页面底部（与身份栏同款材质） -->
      <footer class="footer-bar glass-chip tilt" id="footer-bar">
        <i class="glare" aria-hidden="true"></i>
        <a class="footer-link" id="footer-github" target="_blank" rel="noopener"></a>
        <i class="footer-sep" aria-hidden="true"></i>
        <span class="footer-copy" id="footer-copy"></span>
      </footer>
    </section>
  </main>

  <!-- ============ 欢迎弹窗（仅首次访问展示） ============ -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card glass-panel">
      <h1 class="modal-title" id="modal-title"></h1>
      <p class="modal-text" id="modal-text"></p>
      <button class="cta-btn magnetic" id="modal-btn" type="button"></button>
    </div>
  </div>

  <script src="js/config.js?v=20261035"></script>
  <script src="js/main.js?v=20261035"></script>
</body>
</html>
